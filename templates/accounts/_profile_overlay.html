<div class="user-profile-overlay" id="userProfileOverlay" hidden>
  <section class="user-profile-card" role="dialog" aria-modal="true" aria-labelledby="userProfileName">
    <div class="user-profile-view" id="userProfileView">
      <header class="user-profile-card__header">
        <strong>Информация</strong>
        <div class="user-profile-card__header-actions">
          <button class="user-profile-card__edit" id="userProfileEdit" type="button" aria-label="Редактировать" hidden>✎</button>
          <button class="user-profile-card__close" id="userProfileClose" type="button" aria-label="Закрыть">×</button>
        </div>
      </header>

      <section class="user-profile-card__hero">
        <div class="user-profile-card__avatar" id="userProfileAvatar"></div>
        <h2 id="userProfileName"></h2>
        <p id="userProfileStatus"></p>
      </section>

      <section class="user-profile-card__section user-profile-card__bio" id="userProfileBioSection" hidden>
        <p id="userProfileBio"></p>
        <small>О себе</small>
      </section>

      <section class="user-profile-card__section user-profile-card__details">
        <div class="user-profile-card__row">
          <span class="user-profile-card__icon">@</span>
          <span>
            <strong id="userProfileUsername"></strong>
            <small>Имя пользователя</small>
          </span>
        </div>
      </section>

      <footer class="user-profile-card__actions" id="userProfileActions">
        <button class="user-profile-card__action user-profile-card__action--primary" id="userProfileMessage" type="button">Написать</button>
        <button class="user-profile-card__action" id="userProfileContact" type="button">Добавить в контакты</button>
      </footer>
    </div>

    <form class="user-profile-edit" id="userProfileEditForm" enctype="multipart/form-data" hidden>
      {% csrf_token %}
      <header class="user-profile-card__header">
        <button class="user-profile-edit__back" id="userProfileEditBack" type="button" aria-label="Назад">←</button>
        <strong>Информация</strong>
        <button class="user-profile-card__close" id="userProfileEditClose" type="button" aria-label="Закрыть">×</button>
      </header>

      <section class="user-profile-edit__hero">
        <label class="user-profile-edit__avatar" for="userProfileAvatarInput">
          <input id="userProfileAvatarInput" name="avatar" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <span id="userProfileEditAvatar"></span>
          <b aria-hidden="true">📷</b>
        </label>
        <strong id="userProfileEditDisplayName"></strong>
        <small id="userProfileEditStatus"></small>
      </section>

      <section class="user-profile-edit__section">
        <label class="user-profile-edit__bio">
          <span>О себе</span>
          <textarea id="userProfileBioInput" name="bio" maxlength="160" rows="3"></textarea>
          <small><span id="userProfileBioCount">0</span>/160</small>
        </label>
      </section>

      <section class="user-profile-edit__section user-profile-edit__fields">
        <label>
          <span>Имя</span>
          <input id="userProfileFirstNameInput" name="first_name" type="text" maxlength="150">
        </label>
        <label>
          <span>Фамилия</span>
          <input id="userProfileLastNameInput" name="last_name" type="text" maxlength="150">
        </label>
        <label>
          <span>Имя пользователя</span>
          <span class="user-profile-edit__username"><b>@</b><input id="userProfileUsernameInput" name="username" type="text" maxlength="150"></span>
        </label>
      </section>

      <div class="user-profile-edit__error" id="userProfileEditError" hidden></div>

      <footer class="user-profile-edit__footer">
        <button class="user-profile-edit__save" id="userProfileEditSave" type="submit">Сохранить</button>
      </footer>
    </form>
  </section>
</div>
