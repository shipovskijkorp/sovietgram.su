<dialog id="channelDiscussion" class="channel-discussion" aria-labelledby="channelDiscussionTitle">
  <header><div><strong id="channelDiscussionTitle">Комментарии</strong><small id="discussionPostPreview"></small></div>
    <button id="discussionRefresh" type="button" aria-label="Обновить">↻</button>
    <button id="discussionClose" type="button" aria-label="Закрыть">×</button>
  </header>
  <div class="discussion-toolbar"><span id="discussionStatus" role="status"></span><button type="button" id="discussionLock" class="gallery-open-link" hidden></button></div>
  <div id="discussionScroll" class="discussion-scroll">
    <button type="button" id="discussionOlder" class="gallery-open-link" hidden>Предыдущие комментарии</button>
    <div id="discussionList"></div>
  </div>
  <form id="discussionForm" class="discussion-composer" hidden>
    {% csrf_token %}
    <div id="discussionReply" class="discussion-reply" hidden><span id="discussionReplyText"></span><button id="discussionReplyCancel" type="button" aria-label="Отменить ответ или редактирование">×</button></div>
    <textarea id="discussionText" name="text" rows="2" maxlength="4096" placeholder="Написать комментарий" required></textarea>
    <button type="submit" id="discussionSend">Отправить</button>
  </form>
  <p id="discussionReadOnly" class="discussion-readonly" hidden>Добавление комментариев недоступно.</p>
</dialog>
