<div class="video-note-player" data-video-note-player
     {% if note %}data-note-id="{{ note.pk }}" data-duration-ms="{{ note.duration_ms }}"
     data-mark-played-url="{% url 'messenger:mark_voice_played' note.pk %}"
     data-listened="{% if message.sender_id == request.user.pk or note.pk in voice_listened_attachment_ids %}true{% else %}false{% endif %}"{% endif %}>
  <div class="video-note-player__ring">
    <video class="video-note-player__video" playsinline
           preload="{% if request.user.media_preload %}metadata{% else %}none{% endif %}"
           {% if note %}src="{% url 'messenger:view_attachment' note.pk %}"{% endif %}></video>
    <button type="button" class="video-note-player__play" data-note-play aria-label="Воспроизвести видеокружок">
      <span class="video-note-player__glyph" aria-hidden="true">
        <svg class="video-note-player__play-icon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        <svg class="video-note-player__pause-icon" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
      </span>
    </button>
    <svg class="video-note-player__progress" viewBox="0 0 100 100" aria-label="Позиция воспроизведения"
         role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00" tabindex="-1" data-note-seek>
      <circle class="video-note-player__track" cx="50" cy="50" r="47.5" fill="none"/>
      <circle class="video-note-player__arc" data-note-arc cx="50" cy="50" r="47.5" pathLength="100" fill="none" stroke-dasharray="0 100" transform="rotate(-90 50 50)"/>
      <circle class="video-note-player__thumb" data-note-thumb cx="50" cy="2.5" r="1.7" fill="currentColor"/>
      <circle class="video-note-player__seek-hit" cx="50" cy="50" r="45" fill="none" stroke="transparent" stroke-width="10"/>
    </svg>
    <span class="video-note-player__badge"><span data-note-time>0:00</span><i data-note-unread{% if not note or message.sender_id == request.user.pk or note.pk in voice_listened_attachment_ids %} hidden{% endif %} aria-label="Не просмотрено"></i></span>
    <button type="button" class="video-note-player__mute" data-note-mute aria-label="Выключить звук" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="video-note-player__sound-waves" d="M16 9a4 4 0 0 1 0 6m2-8a7 7 0 0 1 0 10"/><path class="video-note-player__sound-off" d="m16 10 5 5m0-5-5 5"/></svg>
    </button>
    <button type="button" class="video-note-player__collapse" data-note-collapse aria-label="Свернуть видеокружок" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v6h6M18 20v-6h-6M6 10l5-5m7 9-5 5"/></svg>
    </button>
  </div>
  <small class="video-note-player__error" data-note-error role="status" hidden></small>
</div>
