name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run Django tests
        run: python manage.py test
      - name: Check JavaScript syntax
        run: |
          node --check static/js/app.js
          node --check static/js/attachment-menu.js
          node --check static/js/attachment-files.js
          node --check static/js/chat.js
          node --check static/js/voice-messages.js
          node --check static/js/community-wizard.js
          node --check static/js/attachment-special.js
          node --check static/js/article-editor.js
          node --check static/js/chat-controls.js
          node --check static/js/search.js
          node --check static/js/profile.js
          node --check static/js/settings.js
          node --check static/js/community-profile.js
          node --check static/js/community-settings.js

      - name: Test profile and session UI interactions
        run: node --test tests/*.test.cjs

      - name: Package changed and new files
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}" HEAD > /tmp/sovietgram-changed-files.txt
          if [ -s /tmp/sovietgram-changed-files.txt ]; then
            zip -q sovietgram-changed-files.zip -@ < /tmp/sovietgram-changed-files.txt
          fi
          git diff --binary --diff-filter=D "origin/${{ github.base_ref }}" HEAD > deletions.patch
          if [ ! -s deletions.patch ]; then
            rm deletions.patch
          fi
      - name: Upload patch ZIP
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Sovietgram-changed-files-patch
          path: |
            sovietgram-changed-files.zip
            deletions.patch
          if-no-files-found: error
          retention-days: 30
