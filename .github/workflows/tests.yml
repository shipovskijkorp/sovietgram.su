name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 24.04 ships the same PostgreSQL major version as the CI service.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sovietgram_ci
          POSTGRES_USER: sovietgram
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovietgram -d sovietgram_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migrations are committed
        run: python manage.py makemigrations accounts messenger administration --check --dry-run
      - name: Run Django tests
        run: python manage.py test
      - name: Verify shared cache across Django processes
        env:
          SOVIETGRAM_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          python manage.py shell -c 'from django.core.cache import cache; cache.set("ci:shared-cache", 41, 60)'
          python manage.py shell -c 'from django.core.cache import cache; assert cache.incr("ci:shared-cache") == 42; cache.delete("ci:shared-cache")'
      - name: PostgreSQL backup and isolated restore smoke test
        env:
          DB_ENGINE: postgresql
          POSTGRES_DB: sovietgram_ci
          POSTGRES_USER: sovietgram
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          PGHOST: 127.0.0.1
          PGUSER: sovietgram
          PGPASSWORD: ci-only-password
          PGPORT: "5432"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version
          pg_restore --version
          python manage.py migrate --noinput
          python manage.py shell -c 'from apps.accounts.models import User; User.objects.create_user("backup_ci", "backup@example.net", "Backup-ci-test-1945!")'
          BACKUP_DIR=$(mktemp -d)
          python manage.py backup_sovietgram --directory "$BACKUP_DIR"
          ARCHIVE=$(find "$BACKUP_DIR" -maxdepth 1 -name '*.tar.gz' -print -quit)
          python manage.py backup_sovietgram --verify "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$BACKUP_DIR" database.dump
          createdb sovietgram_restore
          pg_restore --exit-on-error --no-owner --no-privileges --dbname=sovietgram_restore "$BACKUP_DIR/database.dump"
          test "$(psql -d sovietgram_restore -Atc "SELECT count(*) FROM accounts_user WHERE username='backup_ci'")" = 1
          dropdb sovietgram_restore
          rm -rf "$BACKUP_DIR"
      - name: Check JavaScript syntax
        run: |
          node --check static/js/easter-star.js
          node --check static/js/app.js
          node --check static/js/pwa.js
          node --check static/js/service-worker.js
          node --check static/js/mobile-ui.js
          node --check static/js/desktop-ui.js
          node --check static/js/attachment-menu.js
          node --check static/js/attachment-files.js
          node --check static/js/send-retry.js
          node --check static/js/durable-outbox.js
          node --check static/js/scheduled-messages.js
          node --check static/js/sound-notifications.js
          node --check static/js/message-status.js
          node --check static/js/message-format.js
          node --check static/js/composer-tools.js
          node --check static/js/message-social.js
          node --check static/js/read-ack.js
          node --check static/js/chat.js
          node --check static/js/channel-discussions.js
          node --check static/js/channel-views.js
          node --check static/js/media-gallery.js
          node --check static/js/voice-messages.js
          node --check static/js/community-wizard.js
          node --check static/js/attachment-special.js
          node --check static/js/article-editor.js
          node --check static/js/chat-controls.js
          node --check static/js/search.js
          node --check static/js/archive.js
          node --check static/js/chat-folders.js
          node --check static/js/stickers.js
          node --check static/js/link-previews.js
          node --check static/js/profile.js
          node --check static/js/settings.js
          node --check static/js/storage-settings.js
          node --check static/js/community-profile.js
          node --check static/js/community-settings.js

      - name: Test profile and session UI interactions
        run: node --test tests/*.test.cjs

      - name: Package changed and new files
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}" HEAD > /tmp/sovietgram-changed-files.txt
          if [ -s /tmp/sovietgram-changed-files.txt ]; then
            zip -q sovietgram-changed-files.zip -@ < /tmp/sovietgram-changed-files.txt
          fi
          git diff --binary --diff-filter=D "origin/${{ github.base_ref }}" HEAD > deletions.patch
          if [ ! -s deletions.patch ]; then
            rm deletions.patch
          fi
      - name: Upload patch ZIP
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Sovietgram-changed-files-patch
          path: |
            sovietgram-changed-files.zip
            deletions.patch
          if-no-files-found: error
          retention-days: 30
